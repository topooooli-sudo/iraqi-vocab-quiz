
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آزمون آزمایشی عربی عراقی</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0001;
    }
    h2 { text-align: center; color: #245b48; }
    .question {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin: 18px 0;
    }
    input[type="text"], textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-family: inherit;
      font-size: 16px;
    }
    label.option {
      display: block;
      padding: 10px;
      margin: 8px 0;
      border-radius: 7px;
      background: #f4f6f8;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #245b48;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }
    button:disabled { background: #888; }
    #result { margin-top: 18px; text-align: center; }
    .correct { background: #d8f5df !important; }
    .wrong { background: #ffe0e0 !important; }
  </style>
</head>
<body>
<div class="container">
  <h2>آزمون آزمایشی عربی عراقی</h2>
  <p>این آزمون برای بررسی ثبت نتایج در شیت است.</p>

  <form id="quizForm">
    <label for="studentName">نام هنرجو:</label>
    <input id="studentName" type="text"
           placeholder="نام خود را وارد کنید" required>

    <div class="question">
      <strong>سؤال ۱ ـ تشریحی (۱ نمره)</strong>
      <p>جملهٔ «من دیروز به بازار رفتم» را به عربی عراقی ترجمه کنید.</p>
      <textarea id="essayAnswer" rows="3"
                placeholder="پاسخ خود را بنویسید" required></textarea>
    </div>

    <div class="question" id="mcqQuestion">
      <strong>سؤال ۲ ـ تستی (۱ نمره)</strong>
      <p>معنی «شْلَوْنَك؟» چیست؟</p>

      <label class="option" id="optA">
        <input type="radio" name="mcq" value="A" required>
        اسمت چیست؟
      </label>

      <label class="option" id="optB">
        <input type="radio" name="mcq" value="B">
        حالت چطور است؟
      </label>

      <label class="option" id="optC">
        <input type="radio" name="mcq" value="C">
        کجا می‌روی؟
      </label>

      <label class="option" id="optD">
        <input type="radio" name="mcq" value="D">
        چند سال داری؟
      </label>
      <p id="mcqFeedback" aria-live="polite"></p>
    </div>

    <button id="submitBtn" type="submit">ثبت و ارسال آزمون</button>
  </form>

  <div id="result" aria-live="polite"></div>
</div>

<script>
  // آدرس وب‌اپ Google Apps Script که به /exec ختم می‌شود:
  const SCRIPT_URL = "آدرس_WEB_APP_خودت_را_اینجا_قرار_بده";

  const form = document.getElementById("quizForm");
  const submitBtn = document.getElementById("submitBtn");
  const result = document.getElementById("result");

  let submitted = false;

  document.querySelectorAll('input[name="mcq"]').forEach(input => {
    input.addEventListener("change", () => {
      document.querySelectorAll(".option").forEach(el => {
        el.classList.remove("correct", "wrong");
      });

      const selected = document.querySelector('input[name="mcq"]:checked');
      const isCorrect = selected.value === "B";

      document.getElementById("optB").classList.add("correct");

      if (!isCorrect) {
        document.getElementById(
          "opt" + selected.value
        ).classList.add("wrong");
      }

      document.getElementById("mcqFeedback").textContent =
        isCorrect ? "آفرین! پاسخ صحیح است 🎉" :
        "پاسخ صحیح: حالت چطور است؟";
    });
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();

    if (submitted) return;

    const studentName =
      document.getElementById("studentName").value.trim();
    const essayAnswer =
      document.getElementById("essayAnswer").value.trim();
    const selected =
      document.querySelector('input[name="mcq"]:checked');

    if (!studentName || !essayAnswer || !selected) {
      result.textContent = "لطفاً همه بخش‌ها را تکمیل کنید.";
      return;
    }

    if (!SCRIPT_URL.startsWith("https://script.google.com/") ||
        !SCRIPT_URL.endsWith("/exec")) {
      result.textContent =
        "ابتدا آدرس صحیح وب‌اپ Google Apps Script را در کد وارد کنید.";
      return;
    }

    const mcqCorrect = selected.value === "B";

    const payload = {
      quizId: "test_index2",
      quizTitle: "آزمون آزمایشی عربی عراقی",
      studentName: studentName,
      eitaaUserId: null,
      totalScore: mcqCorrect ? 1 : 0,
      maxScore: 2,
      multipleChoice: {
        question: "معنی «شْلَوْنَك؟»",
        selected: selected.value,
        correct: mcqCorrect,
        score: mcqCorrect ? 1 : 0
      },
      essay: {
        question: "من دیروز به بازار رفتم",
        answer: essayAnswer,
        maxScore: 1,
        score: null,
        gradingStatus: "pending"
      },
      submittedAt: new Date().toISOString()
    };

    submitBtn.disabled = true;
    result.textContent = "در حال ارسال نتیجه...";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      submitted = true;
      form.querySelectorAll("input, textarea").forEach(el => {
        el.disabled = true;
      });

      result.textContent =
        "درخواست ارسال شد. برای اطمینان، شیت نتایج را بررسی کنید.";
      submitBtn.textContent = "آزمون ارسال شد";

    } catch (error) {
      submitBtn.disabled = false;
      result.textContent =
        "ارسال با خطا مواجه شد. اتصال اینترنت و آدرس اسکریپت را بررسی کنید.";
    }
  });
</script>
</body>
</html>
