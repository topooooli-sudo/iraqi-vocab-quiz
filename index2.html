<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون تشریحی عربی عراقی</title>

<style>
body{
    font-family:tahoma;
    background:#f5f5f5;
    padding:15px;
}

.box{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

textarea{
    width:100%;
    min-height:120px;
    margin-top:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
}

#result{
    display:none;
}
</style>
</head>

<body>

<div class="box">
<h2>آزمون تشریحی عربی عراقی</h2>
<p>۳ سؤال - هر سؤال ۲ نمره</p>
</div>

<div class="box">
<h3>سؤال ۱</h3>
<p>من دیروز او را در بازار دیدم.</p>
<textarea id="q1"></textarea>
</div>

<div class="box">
<h3>سؤال ۲</h3>
<p>چرا هنوز غذا نخوردی؟</p>
<textarea id="q2"></textarea>
</div>

<div class="box">
<h3>سؤال ۳</h3>
<p>فردا می‌خواهم با دوستم به بغداد بروم.</p>
<textarea id="q3"></textarea>
</div>

<button onclick="submitQuiz()">ثبت پاسخ‌ها</button>

<div id="result" class="box">
<h3>پاسخ‌های ثبت شده</h3>

<p><b>پاسخ سؤال ۱:</b></p>
<div id="a1"></div>

<hr>

<p><b>پاسخ سؤال ۲:</b></p>
<div id="a2"></div>

<hr>

<p><b>پاسخ سؤال ۳:</b></p>
<div id="a3"></div>

</div>

<script>

function submitQuiz(){

let q1=document.getElementById("q1").value.trim();
let q2=document.getElementById("q2").value.trim();
let q3=document.getElementById("q3").value.trim();

if(!q1 || !q2 || !q3){
    alert("همه سوالات را پاسخ دهید");
    return;
}

document.getElementById("a1").innerText=q1;
document.getElementById("a2").innerText=q2;
document.getElementById("a3").innerText=q3;

document.getElementById("result").style.display="block";

window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
});

}

</script>

</body>
</html>
