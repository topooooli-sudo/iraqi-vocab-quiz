<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef5ff,#f8f2ff);font-family:Tahoma,Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 35px #0001}.hide{display:none}.center{text-align:center}h1,h2{margin-top:0}.meta{font-size:13px;color:#68738a}.bar{height:8px;background:#e5e9f2;border-radius:20px;overflow:hidden;margin:10px 0 18px}.bar i{display:block;height:100%;background:#4b76ff;width:0;transition:.3s}.q{font-size:20px;font-weight:700;line-height:2;margin:15px 0}.opt{display:block;width:100%;text-align:right;background:#fff;border:2px solid #e1e6ef;border-radius:14px;padding:13px;margin:9px 0;font-size:16px;cursor:pointer}.opt:disabled{cursor:default}.ok{background:#eafff0!important;border-color:#1fa35a!important}.bad{background:#fff0f0!important;border-color:#dc4242!important}input,textarea{width:100%;border:2px solid #dfe4ed;border-radius:14px;padding:12px;font:inherit;line-height:1.9}input:focus,textarea:focus{outline:0;border-color:#4b76ff}textarea{min-height:130px;resize:vertical}.send{border:0;background:#4b76ff;color:#fff;padding:13px 22px;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer}.send:disabled{opacity:.6;cursor:default}.score{font-size:40px;font-weight:900}.box{background:#f7f9fd;border-radius:16px;padding:14px;margin:10px 0;line-height:1.9}.wrong{border-right:5px solid #d94141;background:#fff5f5}.note{line-height:1.9}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.row .send{flex:1}.arabic{font-size:23px;direction:rtl}.flash{position:fixed;inset:0;z-index:9998;pointer-events:none;overflow:hidden}.flash-core{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%) scale(.2);background:#fff;box-shadow:0 0 8px #fff,0 0 22px #ffe45c,0 0 45px #ffd000,0 0 85px #fff2a6;animation:coreBurst .8s cubic-bezier(.15,.75,.25,1) forwards}.flash-ring{position:absolute;left:50%;top:50%;width:50px;height:50px;border:5px solid #ffe36b;border-radius:50%;transform:translate(-50%,-50%) scale(.15);box-shadow:0 0 22px #fff,0 0 45px #ffd52e;animation:ringBurst .85s ease-out forwards}.spark{position:absolute;left:50%;top:50%;width:7px;height:72px;border-radius:10px;background:linear-gradient(to top,#fff,#ffd83d,transparent);transform-origin:50% 100%;box-shadow:0 0 10px #fff,0 0 22px #ffd83d;animation:sparkBurst .7s ease-out forwards}.flash-word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);font-size:25px;font-weight:900;color:#fff;text-shadow:0 0 8px #fff,0 0 18px #ffd83d,0 0 35px #ffb300;opacity:0;animation:wordPop .75s .08s ease-out forwards;white-space:nowrap}@keyframes coreBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}@keyframes ringBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(8);border-width:1px}}@keyframes sparkBurst{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scaleY(.2)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-170px) scaleY(1)}}@keyframes wordPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}.heart{position:fixed;top:-45px;z-index:9999;font-size:28px;animation:fall 4s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.1}}
@media(max-width:520px){.wrap{padding:10px}.card{padding:17px}.q{font-size:18px}.opt{font-size:15px}}
</style>

<body>
<div class="wrap">
<section id="start" class="card center">
  <h1>آزمون عربی عراقی کادردرمان</h1>
  <p>۳۰ سؤال · ۲۰ نمره</p>
  <p class="meta">واژگان اندام و معاینه، زمان افعال، ترجمه و ساعت</p>
  <label for="studentName" class="meta">نام و نام خانوادگی هنرجو</label>
  <input id="studentName" maxlength="100" autocomplete="name" placeholder="نام هنرجو" style="margin:8px 0 16px">
  <button class="send" onclick="startQuiz()">شروع آزمون</button>
  <p class="meta note">پاسخ‌های تستی بلافاصله بررسی می‌شوند. پاسخ‌های تشریحی در پایان با معیارهای زبانی مشخص بررسی می‌شوند؛ پاسخ‌های هم‌معنی با ساختار متفاوت ممکن است به بررسی مدرس نیاز داشته باشند.</p>
</section>
<section id="quiz" class="card hide"><div id="meta" class="meta"></div><div class="bar"><i id="bar"></i></div><div id="body"></div></section>
<section id="result" class="card hide"></section>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4RfBWIeSFmtfCMzGWtIJHxmMoVwwG0TmUqFUGJ67ia-3Fw1zP4HmgsF4Zt4Hso2233Q/exec";

const Q = [
{t:"m",p:.5,q:"«إِصْبَع» یعنی چه؟",a:["مچ دست","انگشت","آرنج","شانه"],c:1,w:"إِصْبَع",m:"انگشت"},
{t:"m",p:.5,q:"«مَرْفَق» یعنی چه؟",a:["آرنج","زانو","پاشنه","شکم"],c:0,w:"مَرْفَق",m:"آرنج"},
{t:"m",p:.5,q:"«رُكْبَة» یعنی چه؟",a:["مچ دست","گردن","زانو","کمر"],c:2,w:"رُكْبَة",m:"زانو"},
{t:"m",p:.5,q:"«مَعْصَم» یعنی چه؟",a:["مچ دست","انگشت پا","آرنج","پشت"],c:0,w:"مَعْصَم",m:"مچ دست"},
{t:"m",p:.5,q:"«كَعْب» یعنی چه؟",a:["شانه","پاشنه","شکم","گلو"],c:1,w:"كَعْب",m:"پاشنه"},
{t:"m",p:.5,q:"«كَتِف» یعنی چه؟",a:["شانه","زانو","چشم","مچ"],c:0,w:"كَتِف",m:"شانه"},
{t:"m",p:.5,q:"«بَطْن» یعنی چه؟",a:["پشت","شکم","سر","گوش"],c:1,w:"بَطْن",m:"شکم"},
{t:"m",p:.5,q:"«ظَهْر» یعنی چه؟",a:["پشت/کمر","دهان","پا","آرنج"],c:0,w:"ظَهْر",m:"پشت یا کمر"},
{t:"m",p:.5,q:"«حَلْق» یعنی چه؟",a:["گلو","گوش","بینی","شانه"],c:0,w:"حَلْق",m:"گلو"},
{t:"m",p:.5,q:"«خَدَر» یعنی چه؟",a:["تورم","بی‌حسی","تب","سرفه"],c:1,w:"خَدَر",m:"بی‌حسی"},
{t:"m",p:.5,q:"«وَرَم» یعنی چه؟",a:["زخم","درد","تورم","سرگیجه"],c:2,w:"وَرَم",m:"تورم"},
{t:"m",p:.5,q:"«يِوَجِّع» یعنی چه؟",a:["می‌خوابد","درد می‌کند","راه می‌رود","می‌خورد"],c:1,w:"يِوَجِّع",m:"درد می‌کند"},
{t:"m",p:.5,q:"«يِحَرِّك» یعنی چه؟",a:["حرکت می‌دهد","می‌بیند","می‌شنود","می‌بندد"],c:0,w:"يِحَرِّك",m:"حرکت می‌دهد"},
{t:"m",p:.5,q:"«يِرَفِّع» یعنی چه؟",a:["پایین می‌آورد","بالا می‌برد","می‌چرخاند","می‌شوید"],c:1,w:"يِرَفِّع",m:"بالا می‌برد"},
{t:"m",p:.5,q:"«يِفْحَص» یعنی چه؟",a:["معاینه می‌کند","تزریق می‌کند","می‌خندد","می‌نویسد"],c:0,w:"يِفْحَص",m:"معاینه می‌کند"},
{t:"m",p:.5,q:"«وَيْن يِوَجِّعَك؟» یعنی چه؟",a:["چند سالته؟","کجا درد می‌کنه؟","کی میای؟","چی خوردی؟"],c:1,w:"وَيْن يِوَجِّعَك؟",m:"کجا درد می‌کند؟"},
{t:"m",p:.5,q:"«رَفِّع إِيدَك» یعنی چه؟",a:["دستت را پایین بیاور","دستت را بالا ببر","دستت را بشوی","دستت را ببند"],c:1,w:"رَفِّع إِيدَك",m:"دستت را بالا ببر"},
{t:"m",p:.5,q:"«اِفْتَح فَمَك» یعنی چه؟",a:["چشمت را ببند","دهانت را باز کن","سرت را بچرخان","پاهایت را بالا ببر"],c:1,w:"اِفْتَح فَمَك",m:"دهانت را باز کن"},
{t:"m",p:.5,q:"«خَلِّينِي أَشُوف» یعنی چه؟",a:["بگذار ببینم","بگذار بنویسم","بگذار بروم","بگذار بخوابم"],c:0,w:"خَلِّينِي أَشُوف",m:"بگذار ببینم"},
{t:"m",p:.5,q:"«يِمْشِي» یعنی چه؟",a:["می‌افتد","راه می‌رود","می‌نشیند","درد دارد"],c:1,w:"يِمْشِي",m:"راه می‌رود"},
{t:"m",p:.5,q:"«دَا يِمْشِي» چه زمانی را نشان می‌دهد؟",a:["ماضی","مضارع استمراری","آینده","ماضی بعید"],c:1,w:"دَا يِمْشِي",m:"در حال راه رفتن است"},
{t:"m",p:.5,q:"کدام گزینه آینده را در عراقی درست می‌سازد؟",a:["راح يِفْحَص","چان يِفْحَص","دا فَحَص","فَحَص راح"],c:0,w:"راح يِفْحَص",m:"معاینه خواهد کرد"},
{t:"m",p:.5,q:"کدام گزینه ساختار استمراری را درست نشان می‌دهد؟",a:["راح يِوَجِّع","دا يِوَجِّع","فَحَص يِوَجِّع","چان راح"],c:1,w:"دا يِوَجِّع",m:"در حال درد کردن است"},
{t:"m",p:.5,q:"کدام گزینه نمونه ماضی استمراری است؟",a:["چان يِفْحَص","دا يِفْحَص","راح يِفْحَص","يِفْحَص"],c:0,w:"چان يِفْحَص",m:"داشت معاینه می‌کرد"},
{t:"m",p:.5,q:"«خَلِّينِي أَفْحَص إِيدَك» یعنی چه؟",a:["بگذار دستت را معاینه کنم","دستت را بالا ببر","دستت را بشوی","بگذار دستم را معاینه کنی"],c:0,w:"خَلِّينِي أَفْحَص إِيدَك",m:"بگذار دستت را معاینه کنم"},
{t:"e",p:2,q:"به عراقی بگو: «دکتر، از دیشب دستم خیلی درد می‌کنه.»",expected:"دكتور، مِن البارحة إيدي تِوَجِّعْنِي هواي.",criteria:[{w:.25,v:["دكتور","دكتوره"]},{w:.35,v:["من البارحة","من البارحه","من امس","من مبارحة"]},{w:.35,v:["ايدي","ايد"]},{w:.65,v:["توجعني","يوجعني","توجع ايدي","تألمني","تالم"]},{w:.4,v:["هواي","كلش","كثير"]}]},
{t:"e",p:2,q:"به عراقی بگو: «دهانت را باز کن تا گلویت را معاینه کنم.»",expected:"اِفْتَح فَمَك خَلّيني أَفْحَص حَلْگَك.",criteria:[{w:.5,v:["افتح"]},{w:.3,v:["فمك","فم","حلكك","حلك"]},{w:.4,v:["خليني","خلني","خليني"]},{w:.4,v:["افحص","افحصلك"]},{w:.4,v:["حلكك","حلقك","حلك","حلق"]}]},
{t:"e",p:2,q:"به عراقی بگو: «اگر درد داشتی، فردا دوباره بیا درمانگاه.»",expected:"إِذا عِنْدَك وَجَع، باچِر تَعال لِلْعِيادَة مَرّة ثانِيَة.",criteria:[{w:.2,v:["اذا","اذا"]},{w:.3,v:["عندك","عندج","اذا تحس"]},{w:.3,v:["وجع","الم","يوجعك","توجعك"]},{w:.3,v:["باچر","باجر","باكر","غدا"]},{w:.3,v:["تعال","ارجع","جي"]},{w:.35,v:["العيادة","عيادة","مستوصف","مركز صحي"]},{w:.25,v:["مرة ثانية","مره ثانيه","مره ثانيه","من جديد","ثاني مرة"]}]},
{t:"e",p:1,q:"جمله «المريض يِمْشِي» را به زمان آینده تبدیل کن.",expected:"المريض راح يِمْشِي.",criteria:[{w:.5,v:["راح","رح"]},{w:.5,v:["يمشي","يمشي"]}]},
{t:"e",p:.5,q:"«ساعت هشت و نیم صبح» را به عربی عراقی بگو.",expected:"السّاعة ثمانِيَة ونِصّ الصبح.",criteria:[{w:.25,v:["ثمانية","ثمانيه","ثمان","8"]},{w:.25,v:["نص","نصف"]}]}
];

let idx=0,mcqScore=0,wrong=[],essays=[],studentName="",uid="",locked=false;
const L=["الف","ب","ج","د"];
function startQuiz(){
 studentName=document.getElementById("studentName").value.trim();
 if(!studentName){alert("لطفاً نام هنرجو را وارد کنید.");document.getElementById("studentName").focus();return;}
 document.getElementById("start").classList.add("hide");document.getElementById("quiz").classList.remove("hide");
 try{const app=window.Eitaa&&window.Eitaa.WebApp?window.Eitaa.WebApp:(window.eitaa&&window.eitaa.WebApp?window.eitaa.WebApp:null);if(app){app.ready();uid=String(app.initDataUnsafe?.user?.id||"");}}catch(e){}
 if(!uid){const params=new URLSearchParams(location.search);uid=params.get("eitaaUserId")||params.get("user_id")||params.get("userId")||"";}
 show();
}
function show(){
 const q=Q[idx],body=document.getElementById("body");
 document.getElementById("meta").textContent=`سؤال ${idx+1} از ${Q.length} · ${fmt(q.p)} نمره`;
 document.getElementById("bar").style.width=(idx/Q.length*100)+"%";
 if(q.t==="m"){
  body.innerHTML=`<div class="q">${esc(q.q)}</div><div id="opts"></div>`;
  q.a.forEach((x,n)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<b>${L[n]}.</b> ${esc(x)}`;b.onclick=()=>choose(n,b);document.getElementById("opts").appendChild(b);});
 }else{
  body.innerHTML=`<div class="q">${esc(q.q)}</div><textarea id="answer" placeholder="پاسخ خود را به عربی عراقی بنویسید..."></textarea><p class="meta">نمره: ${fmt(q.p)} · پاسخ در پایان بررسی می‌شود.</p><div class="row"><button class="send" onclick="saveEssay()">ثبت پاسخ و ادامه</button><button class="send" style="background:#8792a7" onclick="skipEssay()">بدون پاسخ، ادامه</button></div>`;
 }
}
function choose(n,b){
 if(locked)return;const q=Q[idx],opts=[...document.querySelectorAll(".opt")];opts.forEach(x=>x.disabled=true);
 if(n===q.c){mcqScore+=q.p;b.classList.add("ok");lightBurst();vibrate();}
 else{b.classList.add("bad");opts[q.c].classList.add("ok");wrong.push({w:q.w||q.q,m:q.m||""});}
 setTimeout(next,700);
}
function saveEssay(){const v=document.getElementById("answer").value.trim();essays.push({index:idx,question:Q[idx].q,answer:v,expected:Q[idx].expected,maxScore:Q[idx].p,criteria:Q[idx].criteria});next();}
function skipEssay(){const v=document.getElementById("answer").value.trim();if(v){saveEssay();return;}essays.push({index:idx,question:Q[idx].q,answer:"",expected:Q[idx].expected,maxScore:Q[idx].p,criteria:Q[idx].criteria});next();}
function next(){idx++;if(idx<Q.length)show();else finish();}
function normalizeArabic(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/گ/g,"ك").replace(/[،؛؟,.!؟:؛]/g," ").replace(/[^\u0600-\u06FF0-9\s]/g," ").replace(/\s+/g," ").trim();}
function gradeEssays(){return essays.map(x=>{const q=Q[x.index],answer=x.answer||"",n=normalizeArabic(answer);let score=0;const criteria=q.criteria||[];if(n){criteria.forEach(c=>{const found=c.v.some(term=>n.includes(normalizeArabic(term)));if(found)score+=c.w;});}score=Math.min(q.p,Math.round(score*100)/100);return {question:q.q,answer:answer,correctAnswer:q.expected,score:score,maxScore:q.p,correct:score>=q.p-0.001,feedback:score>=q.p-0.001?"":(answer?"پاسخ با معیارهای کلیدی این سؤال کاملاً منطبق نبود.":"پاسخی ثبت نشده است.")};});}
function gradeMcqs(){return Q.map((q,i)=>({q,i})).filter(x=>x.q.t==="m").map(({q})=>({arabic:q.w||q.q,meaning:q.m||"",correctAnswer:q.a[q.c],correct:true,score:q.p,maxScore:q.p}));}
async function finish(){
 locked=true;document.getElementById("quiz").classList.add("hide");const panel=document.getElementById("result");panel.classList.remove("hide");panel.innerHTML='<div class="center"><h2>آزمون تمام شد</h2><p>در حال محاسبهٔ نتیجه…</p></div>';
 const essayResults=gradeEssays();const essayScore=essayResults.reduce((s,x)=>s+x.score,0);const mcqTotal=Q.filter(x=>x.t==="m").reduce((s,x)=>s+x.p,0);const total=mcqScore+essayScore;const percent=Math.round(total/20*100);const mcqCorrect=mcqScore/.5;const essayFullyCorrect=essayResults.filter(x=>x.correct).length;const fullyCorrect=mcqCorrect+essayFullyCorrect;const wrongCount=30-fullyCorrect;
 let html=`<div class="center"><h2>نتیجهٔ آزمون</h2><div class="score">${fmt(total)} از ۲۰</div><p>نمرهٔ تستی: <b>${fmt(mcqScore)} از ${fmt(mcqTotal)}</b><br>نمرهٔ تشریحی: <b>${fmt(essayScore)} از ۷٫۵</b><br>درصد: <b>${fmt(percent)}٪</b></p><p>سؤال‌های کاملاً درست: <b>${fmt(fullyCorrect)}</b> از ۳۰</p></div>`;
 if(wrong.length){html+='<h3>معنی سؤال‌های تستیِ اشتباه</h3>';wrong.forEach(x=>{html+=`<div class="box wrong"><span class="arabic">${esc(x.w)}</span><br>${esc(x.m)}</div>`;});}
 const essayWrong=essayResults.filter(x=>!x.correct);
 html+='<h3>پاسخ‌های تشریحی نیازمند اصلاح</h3>';
 if(!essayWrong.length)html+='<div class="box">همهٔ پاسخ‌های تشریحی با معیارهای کلیدی این آزمون منطبق بودند. 🎉</div>';
 else essayWrong.forEach(x=>{html+=`<div class="box wrong"><b>سؤال:</b> ${esc(x.question)}<br><b>پاسخ هنرجو:</b> ${esc(x.answer||"بی‌پاسخ")}<br><b>پاسخ معیار:</b> ${esc(x.correctAnswer)}<br><b>نمره:</b> ${fmt(x.score)} از ${fmt(x.maxScore)}</div>`;});
 html+='<p class="meta note">تصحیح تشریحی در این نسخه با معیارهای کلیدی انجام می‌شود، نه هوش مصنوعی؛ اگر پاسخ هم‌معنی با واژه‌های متفاوت باشد ممکن است نمرهٔ دقیق نیاز به بررسی مدرس داشته باشد.</p><div id="saveStatus" class="meta note">در حال ارسال نتیجه به گوگل‌شیت…</div>';
 panel.innerHTML=html;panel.scrollIntoView({behavior:"smooth",block:"start"});
 const essayCorrectCount=essayResults.filter(x=>x.correct).length;

async function sendResult(payload){try{await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});const status=document.getElementById("saveStatus");if(status)status.textContent="درخواست ارسال شد. لطفاً برای اطمینان از ثبت، ردیف جدید را در Sheet1 بررسی کنید.";}catch(e){const status=document.getElementById("saveStatus");if(status)status.textContent="ارسال نتیجه انجام نشد؛ اینترنت را بررسی کنید و دوباره از مدرس بخواهید نتیجه را ثبت کند.";}}
function fmt(n){return Number(n||0).toLocaleString("fa-IR",{maximumFractionDigits:2});}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function lightBurst(){const f=document.createElement("div");f.className="flash";f.setAttribute("aria-hidden","true");f.innerHTML='<div class="flash-core"></div><div class="flash-ring"></div><div class="flash-word">آفرین! ✓</div>';for(let i=0;i<20;i++){const s=document.createElement("div");s.className="spark";s.style.setProperty("--a",(i*18)+"deg");s.style.animationDelay=(i%4)*.025+"s";f.appendChild(s);}document.body.appendChild(f);setTimeout(()=>f.remove(),1100);}
function vibrate(){try{if(navigator.vibrate)navigator.vibrate([45,25,70]);}catch(e){}}
function hearts(){for(let i=0;i<48;i++){const e=document.createElement("div");e.className="heart";e.textContent=["❤️","💖","💗","💕"][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),5500);}}
