<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>آزمون سوم عربی عراقی</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf5ff,#f9f1ff);font-family:Tahoma,Arial,sans-serif;color:#18233a}.wrap{max-width:740px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px #0001}.center{text-align:center}.hide{display:none}.muted{font-size:13px;color:#6b7489;line-height:1.9}.bar{height:8px;background:#e7ebf4;border-radius:20px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#4d77ff;width:0;transition:.3s}.question{font-size:20px;font-weight:bold;line-height:2;margin:18px 0}.opt{display:block;width:100%;text-align:right;background:white;border:2px solid #e1e6ef;border-radius:14px;padding:14px;margin:9px 0;font-size:16px;cursor:pointer}.opt:disabled{cursor:default}.correct{background:#eafff0!important;border-color:#19a35a!important;color:#096b31}.incorrect{background:#fff0f0!important;border-color:#dd4141!important;color:#9e2020}textarea{width:100%;min-height:140px;border:2px solid #dfe4ed;border-radius:14px;padding:13px;font:inherit;line-height:1.9}button.primary{border:0;background:#4d77ff;color:white;padding:14px 22px;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer}.box{background:#f7f9fd;border-radius:15px;padding:14px;margin:10px 0;line-height:2}.wrongbox{background:#fff5f5;border-right:5px solid #d84444}.essaybox{border:1px solid #e0e6ef}.score{font-size:44px;font-weight:900}.badge{display:inline-block;background:#eff3ff;border-radius:30px;padding:6px 12px;font-size:13px}.celebrate{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}.particle{position:absolute;top:-30px;animation:fall linear forwards;filter:drop-shadow(0 2px 4px #0002)}@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:.2}}.quote{font-size:20px;font-weight:bold;line-height:2.2;text-align:center;padding:15px}.quote-fa{line-height:2;text-align:center}.status{font-size:13px;color:#6b7489}
</style></head><body><div class="wrap">
<section id="start" class="card center"><h1>آزمون سوم · عربی عراقی</h1><p>واژگان میوه‌ها و اعضای بدن با تأکید بر مکالمات کادر درمان</p><div class="box">۳۰ سؤال · ۲۰ نمره</div><p class="muted">در سؤال‌های تستی، نتیجه بلافاصله نمایش داده می‌شود. در سؤال تشریحی تا واردکردن پاسخ نمی‌توانید جلو بروید.</p><button class="primary" onclick="startQuiz()">شروع آزمون</button></section>
<section id="quiz" class="card hide"><div id="meta" class="muted"></div><div class="bar"><i id="bar"></i></div><div id="qbody"></div></section><section id="result" class="card hide"></section></div><div id="fx" class="celebrate"></div>
<script src="https://developer.eitaa.com/eitaa-web-app.js"></script><script>
// آدرس Web App سمت سرور برای تصحیح هوش مصنوعی را پس از آماده‌شدن backend اینجا قرار دهید.
// کلید API هوش مصنوعی را هرگز در فایل HTML قرار ندهید.

const AI_ENDPOINT="https://script.google.com/macros/s/AKfycbydVtdYvp0BeH8HhSgen_mGYh0JrvS6J9uZpCXNcrTVgFQ0WS-x1OXyZWYMRc7bbXL8Eg/exec";
const questions=[
// ۲۰ واژگان تازه؛ از واژگان تست قبلی مثل إصبع، مرفق، ركبة، معصم، كعب، كتف، بطن، ظهر، حلق، خدر، ورم و يوجع اجتناب شده است.
{t:'e',p:.5,q:'(بگو): «ساعت نه و ربع شب» به عربی عراقی.',expected:'السّاعة تِسْعَة ورُبْع بالليل.',rubric:'بیان طبیعی ساعت: ۰٫۵ نمره'}
];
let pos=0,mcqScore=0,wrong=[],essayAnswers=[],userId='';
function startQuiz(){document.getElementById('start').classList.add('hide');document.getElementById('quiz').classList.remove('hide');try{if(window.Eitaa&&Eitaa.WebApp){Eitaa.WebApp.ready();userId=String(Eitaa.WebApp.initDataUnsafe?.user?.id||'')}}catch(e){}renderQuestion()}
function renderQuestion(){let q=questions[pos],body=document.getElementById('qbody');document.getElementById('meta').textContent=`سؤال ${pos+1} از ${questions.length} · ${q.p} نمره`;document.getElementById('bar').style.width=(pos/questions.length*100)+'%';if(q.t==='m'){body.innerHTML=`<div class="question">${q.q}</div><div id="options"></div>`;q.a.forEach((a,n)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`${['الف','ب','ج','د'][n]}. ${a}`;b.onclick=()=>answerMCQ(n,b);document.getElementById('options').appendChild(b)})}else{body.innerHTML=`<span class="badge">سؤال تشریحی · ${q.p} نمره</span><div class="question">${q.q}</div><textarea id="essay" placeholder="پاسخ را بنویسید؛ بدون پاسخ نمی‌توانید ادامه دهید."></textarea><p id="needAnswer" class="muted"></p><button class="primary" onclick="saveEssay()">ثبت پاسخ و ادامه</button>`}}
function answerMCQ(n,btn){let q=questions[pos],opts=[...document.querySelectorAll('.opt')];opts.forEach(x=>x.disabled=true);if(n===q.c){mcqScore+=q.p;btn.classList.add('correct');fireworks()}else{btn.classList.add('incorrect');opts[q.c].classList.add('correct');wrong.push({word:q.w||q.q,meaning:q.m||q.a[q.c],chosen:q.a[n],correct:q.a[q.c],question:q.q})}try{if(navigator.vibrate)navigator.vibrate(n===q.c?[40,30,60]:100)}catch(e){}setTimeout(next,850)}
function saveEssay(){let el=document.getElementById('essay'),v=el.value.trim();if(!v){document.getElementById('needAnswer').textContent='برای رفتن به سؤال بعد، ابتدا پاسخ را بنویسید.';el.focus();return}essayAnswers.push({index:pos,question:questions[pos].q,answer:v,expected:questions[pos].expected,rubric:questions[pos].rubric,maxScore:questions[pos].p});next()}
function next(){pos++;if(pos<questions.length)renderQuestion();else finish()}
async function finish(){document.getElementById('quiz').classList.add('hide');let res=document.getElementById('result');res.classList.remove('hide');res.innerHTML='<div class="center"><h2>در حال بررسی پاسخ‌های تشریحی…</h2><p class="muted">برای تصحیح واقعی هوش مصنوعی باید AI_ENDPOINT به Web App سمت سرور متصل باشد.</p></div>';let graded=[],analysis=null;if(AI_ENDPOINT){try{let response=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'grade_essays',exam:'third',userId,mcqScore,mcqWrong:wrong,answers:essayAnswers})});let data=await response.json();graded=data.gradedAnswers||data.results||[];analysis=data.analysis||null}catch(e){alert("خطای اتصال: "+e.message);}}if(!graded.length){graded=essayAnswers.map(a=>({question:a.question,studentAnswer:a.answer,correctAnswer:a.expected,score:0,maxScore:a.maxScore,analysis:'اتصال تصحیح هوش مصنوعی هنوز تنظیم نشده است؛ این پاسخ نمره‌گذاری نشده است.'}));analysis={strengths:'پس از اتصال هوش مصنوعی، نقاط قوت بر اساس پاسخ‌های تستی و تشریحی استخراج می‌شود.',weaknesses:'پس از اتصال هوش مصنوعی، موارد نیازمند تمرین بر اساس پاسخ‌های آزمون استخراج می‌شود.'}}let essayScore=graded.reduce((s,x)=>s+(Number(x.score)||0),0),total=Math.min(20,mcqScore+essayScore);showResults(total,graded,analysis)}
function showResults(total,graded,analysis){let h=`<div class="center"><h2>نتیجه آزمون سوم</h2><div class="score">${total.toFixed(1)} / 20</div><p>${(total/20*100).toFixed(0)}٪</p></div>`;h+='<h3>واژگان تست‌های غلط</h3>';h+=wrong.length?wrong.map(x=>`<div class="box wrongbox"><b>${esc(x.word)} : ${esc(x.meaning)}</b><div class="muted">انتخاب شما: ${esc(x.chosen)} · پاسخ صحیح: ${esc(x.correct)}</div></div>`).join(''):'<div class="box">همه سؤال‌های تستی را درست پاسخ دادید.</div>';h+='<h3>بررسی پاسخ‌های تشریحی</h3>';h+=graded.map((x,i)=>`<div class="box essaybox"><b>سؤال</b><br>${esc(x.question||essayAnswers[i]?.question||'')}<br><br><b>جواب نادرست/پاسخ دانشجو</b><br>${esc(x.studentAnswer||x.answer||essayAnswers[i]?.answer||'')}<br><br><b>جواب درست</b><br>${esc(x.correctAnswer||x.expected||essayAnswers[i]?.expected||'')}<br><br><b>تحلیل</b><br>${esc(x.analysis||x.feedback||'')}<br><b>نمره: ${Number(x.score)||0} از ${x.maxScore??essayAnswers[i]?.maxScore}</b></div>`).join('');h+='<h3>نقاط قوت و ضعف شما</h3><div class="box"><b>نقاط قوت</b><br>'+esc(analysis?.strengths||'پس از تحلیل هوش مصنوعی نمایش داده می‌شود.')+'</div><div class="box"><b>موارد نیازمند تمرین</b><br>'+esc(analysis?.weaknesses||'پس از تحلیل هوش مصنوعی نمایش داده می‌شود.')+'</div>';if(total>=18){h+=`<div class="quote">مَثَلُ الدُّنْيَا كَمَثَلِ ظِلِّك، إِنْ طَلَبْتَهُ تَبَاعَدَ وَإِنْ تَرَكْتَهُ تَتَابَع</div><p class="quote-fa">دنیا مثل سایه توست؛ اگر آن را دنبال کنی، دور می‌شود و اگر رهایش کنی، به دنبالت می‌آید.</p>`;heartRain()}document.getElementById('result').innerHTML=h}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fireworks(){let fx=document.getElementById('fx'),symbols=['🎉','✨','🌈','🎊','🟣','🟡','🔵','🩷'];for(let i=0;i<48;i++){let e=document.createElement('span');e.className='particle';e.textContent=symbols[Math.floor(Math.random()*symbols.length)];e.style.left=Math.random()*100+'%';e.style.animationDuration=(1.1+Math.random()*1.5)+'s';e.style.animationDelay=Math.random()*.2+'s';e.style.fontSize=(14+Math.random()*18)+'px';fx.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function heartRain(){let fx=document.getElementById('fx');for(let i=0;i<90;i++){let e=document.createElement('span');e.className='particle';e.textContent=['❤️','💖','💗','💕','💘'][Math.floor(Math.random()*5)];e.style.left=Math.random()*100+'%';e.style.animationDuration=(2.3+Math.random()*3)+'s';e.style.animationDelay=Math.random()*1.3+'s';e.style.fontSize=(18+Math.random()*18)+'px';fx.appendChild(e);setTimeout(()=>e.remove(),6500)}}
</script></body></html>
