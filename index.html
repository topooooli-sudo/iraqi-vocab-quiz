<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

<title>آزمون واژگان عربی عراقی</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Tahoma,Arial,sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f8fafc
    );

  color:#222;
  overflow-x:hidden;
}

.container{
  max-width:600px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:23px;
  margin:10px 0 8px;
}

.user{
  text-align:center;
  color:#666;
  margin-bottom:18px;
}


/* =========================
   صفحه ورود نام دانشجو
========================= */

#startScreen{
  background:white;
  border-radius:20px;
  padding:25px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);

  text-align:center;
}

#startScreen h2{
  margin-top:0;
}

#studentName{
  width:100%;
  padding:14px;

  border:1px solid #ddd;
  border-radius:12px;

  font-size:17px;
  text-align:right;

  margin:15px 0;
  outline:none;
}

#studentName:focus{
  border-color:#6366f1;
}

.start-button{
  width:100%;
  border:none;
  border-radius:14px;

  padding:15px;

  background:#4f46e5;
  color:white;

  font-size:18px;
  cursor:pointer;
}

.start-button:active{
  transform:scale(.98);
}

.name-error{
  color:#ef4444;
  margin-bottom:12px;
  display:none;
}


/* =========================
   کارت آزمون
========================= */

.card{
  background:white;
  border-radius:20px;
  padding:22px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);
}

.progress{
  text-align:center;
  color:#666;
  margin-bottom:15px;
}

.question{
  font-size:20px;
  font-weight:bold;
  line-height:1.8;
  margin-bottom:20px;
}

.option{
  width:100%;
  border:none;
  border-radius:14px;

  padding:15px;
  margin:7px 0;

  background:#f1f5f9;

  font-size:17px;
  cursor:pointer;

  text-align:right;

  transition:.2s;
}

.option:hover{
  background:#e2e8f0;
}

.option.correct{
  background:#22c55e !important;
  color:white;
}

.option.wrong{
  background:#ef4444 !important;
  color:white;
}

.option.disabled{
  pointer-events:none;
}


/* =========================
   نتیجه
========================= */

.result{
  display:none;
  text-align:center;

  background:white;
  border-radius:20px;
  padding:25px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);
}

.result h2{
  margin-top:0;
}

.score{
  font-size:34px;
  font-weight:bold;
  margin:15px 0;
}

.final-details{
  line-height:2;
  font-size:17px;
}

.wrong-title{
  margin-top:25px;
  margin-bottom:15px;

  font-size:18px;
  font-weight:bold;
}

.wrong-word{
  margin:8px 0;
  padding:10px 14px;

  background:#fff1f2;
  border-radius:12px;

  text-align:right;

  font-size:17px;
  line-height:1.8;
}

.wrong-word b{
  color:#222;
}

.perfect-message{
  margin-top:25px;
  padding:18px 12px;

  background:#f0fdf4;
  border-radius:15px;

  font-size:18px;
  line-height:2;
}

.perfect-message .arabic{
  font-weight:bold;
  direction:rtl;
  margin-bottom:8px;
}

.save-status{
  margin-top:20px;
  color:#555;
  line-height:1.8;
}


/* =========================
   افکت پاسخ درست
========================= */

.confetti{
  position:fixed;
  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:9996;
}

.confetti span{
  position:absolute;

  top:0;

  border-radius:3px;

  opacity:1;
}

@keyframes fall{

  0%{
    transform:
      translateY(-20px)
      rotate(0deg);

    opacity:1;
  }

  100%{
    transform:
      translateY(105vh)
      rotate(720deg);

    opacity:0;
  }

}


/* =========================
   قلب باران
========================= */

.heart-rain{
  position:fixed;
  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:9998;
}

.heart{
  position:absolute;

  top:-50px;

  font-size:25px;

  animation:
    heartFall linear forwards;

  user-select:none;
}

@keyframes heartFall{

  0%{
    transform:
      translateY(-50px)
      rotate(0deg);

    opacity:1;
  }

  100%{
    transform:
      translateY(110vh)
      rotate(360deg);

    opacity:.9;
  }

}


/* =========================
   نورافشانی
========================= */

.light-show{
  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:9997;

  animation:
    lightFlash .7s infinite;
}

@keyframes lightFlash{

  0%{
    box-shadow:
      inset 0 0 0 0
      rgba(255,255,255,0);
  }

  25%{
    box-shadow:
      inset 0 0 80px 20px
      rgba(255,255,255,.75);
  }

  50%{
    box-shadow:
      inset 0 0 0 0
      rgba(255,255,255,0);
  }

  75%{
    box-shadow:
      inset 0 0 100px 30px
      rgba(255,255,255,.65);
  }

  100%{
    box-shadow:
      inset 0 0 0 0
      rgba(255,255,255,0);
  }

}


/* =========================
   ذرات نور
========================= */

.sparkle{
  position:fixed;

  width:8px;
  height:8px;

  border-radius:50%;

  background:white;

  pointer-events:none;

  z-index:9999;

  box-shadow:
    0 0 10px 4px white;

  animation:
    sparkleAnim .9s linear forwards;
}

@keyframes sparkleAnim{

  0%{
    transform:
      scale(.2)
      translate(0,0);

    opacity:1;
  }

  100%{
    transform:
      scale(1.5)
      translate(
        var(--dx),
        var(--dy)
      );

    opacity:0;
  }

}


/* =========================
   موبایل
========================= */

@media(max-width:500px){

  body{
    padding:12px;
  }

  .card{
    padding:18px;
  }

  .question{
    font-size:18px;
  }

  .option{
    font-size:16px;
  }

}

</style>

</head>


<body>

<div class="container">

<h1>
آزمون واژگان عربی عراقی
</h1>


<!-- =========================
     ورود نام دانشجو
========================= -->

<div id="startScreen">

  <h2>
    شروع آزمون
  </h2>

  <div>
    لطفاً نام و نام خانوادگی خود را وارد کنید
  </div>

  <input
    id="studentName"
    type="text"
    placeholder="نام و نام خانوادگی"
    autocomplete="name"
  >

  <div
    id="nameError"
    class="name-error"
  >
    لطفاً نام دانشجو را وارد کنید.
  </div>

  <button
    class="start-button"
    onclick="startQuiz()"
  >
    شروع آزمون
  </button>

</div>


<div
  id="userInfo"
  class="user"
  style="display:none"
></div>


<!-- =========================
     آزمون
========================= -->

<div
  id="quizCard"
  class="card"
  style="display:none"
>

  <div
    id="progress"
    class="progress"
  ></div>

  <div
    id="question"
    class="question"
  ></div>

  <div id="options"></div>

</div>


<!-- =========================
     نتیجه
========================= -->

<div
  id="result"
  class="result"
>

  <h2>
    آزمون به پایان رسید
  </h2>

  <div
    id="finalScore"
    class="score"
  ></div>

  <div
    id="finalDetails"
    class="final-details"
  ></div>

  <div id="wrongAnswers"></div>

  <div
    id="saveStatus"
    class="save-status"
  >
    نتیجه در حال ارسال است...
  </div>

</div>

</div>


<script>


/* =========================
   Google Sheets
========================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwlQiJOCORFZaTSzNDJYWyZ7jh96OM3zrTcnMz90-1PqGqRqiVJLWSH152MxuW3QNua/exec";


/* =========================
   متغیرها
========================= */

let current = 0;

let score = 0;

let correctCount = 0;

let wrongCount = 0;

let eitaaUserId = "";

let studentName = "";

let wrongAnswers = [];


/* =========================
   سؤالات
========================= */

const questions = [

{q:"«شُوَكِت» یعنی چه؟",a:["کجا","کی / چه وقت","چقدر","چرا"],c:1},

{q:"«وَيْن» یعنی چه؟",a:["کجا","چرا","کی","چطور"],c:0},

{q:"«شْلَوْنَك؟» یعنی چه؟",a:["اسمت چیست؟","کجایی؟","حالت چطوره؟","چند سالته؟"],c:2},

{q:"«شِسْمَك؟» یعنی چه؟",a:["کجایی؟","اسمت چیه؟","چی می‌خوری؟","کی میای؟"],c:1},

{q:"«هَسَّه» یعنی چه؟",a:["دیروز","فردا","الان / همین حالا","بعداً"],c:2},

{q:"«بَچِر» یعنی چه؟",a:["امروز","فردا","دیشب","هفته بعد"],c:1},

{q:"«أَمْس» یعنی چه؟",a:["امروز","فردا","دیروز","الان"],c:2},

{q:"«هِنانه» یعنی چه؟",a:["آنجا","اینجا","بالا","پایین"],c:1},

{q:"«هِنَاك» یعنی چه؟",a:["اینجا","آنجا","کنار","داخل"],c:1},

{q:"«قُرِيب» یعنی چه؟",a:["دور","بزرگ","نزدیک","شلوغ"],c:2},

{q:"«شْكُو مَا شْكُو؟» یعنی چه؟",a:["چه خبر؟","کجایی؟","چقدر است؟","چه می‌خوری؟"],c:0},

{q:"«أرِيد» یعنی چه؟",a:["می‌خواهم","می‌دانم","می‌روم","می‌بینم"],c:0},

{q:"«مَا أَرِيد» یعنی چه؟",a:["نمی‌دانم","نمی‌خواهم","نمی‌روم","نمی‌بینم"],c:1},

{q:"«أكْدَر» یعنی چه؟",a:["می‌توانم","می‌خواهم","می‌دانم","می‌گیرم"],c:0},

{q:"«مَا أَكْدَر» یعنی چه؟",a:["نمی‌خواهم","نمی‌توانم","نمی‌دانم","نمی‌روم"],c:1},

{q:"«أحچي» یعنی چه؟",a:["می‌خورم","صحبت می‌کنم","می‌خوابم","می‌نشینم"],c:1},

{q:"«جاي أَحچي» یعنی چه؟",a:["صحبت کردم","دارم صحبت می‌کنم","صحبت خواهم کرد","صحبت نکن"],c:1},

{q:"«راح أروح» یعنی چه؟",a:["رفتم","دارم می‌روم","خواهم رفت","نرو"],c:2},

{q:"«لا تِروح» یعنی چه؟",a:["نرو","نرفتم","می‌روم","برو"],c:0},

{q:"«شَاف» یعنی چه؟",a:["گفت","دید","خرید","فروخت"],c:1},

{q:"«بَاع» یعنی چه؟",a:["خرید","فروخت","دید","گفت"],c:1},

{q:"«رَاح» یعنی چه؟",a:["آمد","رفت","خوابید","ترسید"],c:1},

{q:"«نَام» یعنی چه؟",a:["خوابید","ایستاد","رفت","خورد"],c:0},

{q:"«خَاف» یعنی چه؟",a:["خندید","ترسید","دوید","گفت"],c:1},

{q:"«گَام» در عراقی یعنی چه؟",a:["بلند شد / از جا بلند شد","خوابید","فروخت","پرسید"],c:0},

{q:"«گَال» یعنی چه؟",a:["گفت","دید","آمد","گرفت"],c:0},

{q:"«صَار» یعنی چه؟",a:["شد / تبدیل شد","رفت","خورد","خرید"],c:0},

{q:"«سَوّي» یعنی چه؟",a:["بیا","انجام بده / درست کن","بخواب","برو"],c:1},

{q:"«اِسْتَنّى» یعنی چه؟",a:["صبر کن / منتظر باش","بیا","برو","بنشین"],c:0},

{q:"«فَحْص دَم» یعنی چه؟",a:["عکس‌برداری","آزمایش خون","آزمایش ادرار","سونوگرافی"],c:1},

{q:"«أَسَوّي فَحْص دَم» یعنی چه؟",a:["آزمایش خون می‌دهم / انجام می‌دهم","خون می‌فروشم","دکتر می‌شوم","دارو می‌خرم"],c:0},

{q:"«ناظور» در محیط درمانی عراقی یعنی چه؟",a:["رادیولوژی","آندوسکوپی / کولونوسکوپی","آزمایش خون","فشارخون"],c:1},

{q:"«سُونار» یعنی چه؟",a:["سونوگرافی","تزریق","آندوسکوپی","آزمایش خون"],c:0},

{q:"«إبْرَة» یعنی چه؟",a:["قرص","آمپول / سوزن","پماد","باند"],c:1},

{q:"«وِين أَكُو أَكْل عِرَاقِي زَيْن؟» یعنی چه؟",a:["غذای عراقی خوب کجاست؟","غذای عراقی چقدر است؟","چه کسی غذای عراقی می‌پزد؟","غذای عراقی ندارید؟"],c:0},

{q:"«مَطْعَم» یعنی چه؟",a:["داروخانه","رستوران","بیمارستان","آزمایشگاه"],c:1},

{q:"«شِگَد؟» یعنی چه؟",a:["کجا؟","چرا؟","چقدر؟","کی؟"],c:2},

{q:"«شْعَلَيْك؟» یعنی چه؟",a:["چه ربطی به تو دارد؟ / به تو چه؟","کجایی؟","چقدر می‌خواهی؟","چه وقت می‌آیی؟"],c:0},

{q:"«مَا أَدْرِي» یعنی چه؟",a:["نمی‌خواهم","نمی‌دانم","نمی‌توانم","نمی‌روم"],c:1},

{q:"«إحنا» یعنی چه؟",a:["شما","آنها","ما","من"],c:2}

];


/* =========================
   دریافت اطلاعات ایتا
========================= */

function initEitaa(){

  try{

    if(
      window.Eitaa &&
      window.Eitaa.WebApp
    ){

      const webApp =
        window.Eitaa.WebApp;

      if(
        typeof webApp.ready === "function"
      ){
        webApp.ready();
      }

      if(
        typeof webApp.expand === "function"
      ){
        webApp.expand();
      }

      if(
        webApp.initDataUnsafe &&
        webApp.initDataUnsafe.user
      ){

        const user =
          webApp.initDataUnsafe.user;

        if(user.id){
          eitaaUserId =
            String(user.id);
        }

      }

    }

  }catch(error){

    console.log(
      "Eitaa error:",
      error
    );

  }

}


/* =========================
   شروع آزمون
========================= */

function startQuiz(){

  const input =
    document.getElementById(
      "studentName"
    );

  const error =
    document.getElementById(
      "nameError"
    );

  studentName =
    input.value.trim();

  if(!studentName){

    error.style.display =
      "block";

    input.focus();

    return;

  }

  error.style.display =
    "none";

  document.getElementById(
    "startScreen"
  ).style.display =
    "none";

  document.getElementById(
    "quizCard"
  ).style.display =
    "block";

  document.getElementById(
    "userInfo"
  ).style.display =
    "block";

  document.getElementById(
    "userInfo"
  ).textContent =
    "دانشجو: " + studentName;

  renderQuestion();

}


/* =========================
   نمایش سؤال
========================= */

function renderQuestion(){

  const q =
    questions[current];

  document.getElementById(
    "progress"
  ).textContent =
    "سؤال " +
    (current + 1) +
    " از " +
    questions.length;

  document.getElementById(
    "question"
  ).textContent =
    q.q;

  const options =
    document.getElementById(
      "options"
    );

  options.innerHTML = "";

  q.a.forEach(
    function(answer,index){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "option";

      button.textContent =
        answer;

      button.onclick =
        function(){

          answerQuestion(
            index,
            button
          );

        };

      options.appendChild(
        button
      );

    }
  );

}


/* =========================
   پاسخ
========================= */

function answerQuestion(
  selected,
  selectedButton
){

  const q =
    questions[current];

  const buttons =
    document.querySelectorAll(
      ".option"
    );

  buttons.forEach(
    function(button){

      button.classList.add(
        "disabled"
      );

    }
  );

  if(
    selected === q.c
  ){

    selectedButton.classList.add(
      "correct"
    );

    score += 0.5;

    correctCount++;

    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        120
      );

    }

    showConfetti();

  }else{

    selectedButton.classList.add(
      "wrong"
    );

    buttons[q.c].classList.add(
      "correct"
    );

    wrongCount++;

    wrongAnswers.push({

      word:q.q,

      correctAnswer:
        q.a[q.c]

    });

  }

  setTimeout(
    function(){

      current++;

      if(
        current <
        questions.length
      ){

        renderQuestion();

      }else{

        finishQuiz();

      }

    },
    900
  );

}


/* =========================
   پایان آزمون
========================= */

function finishQuiz(){

  document.getElementById(
    "quizCard"
  ).style.display =
    "none";

  document.getElementById(
    "result"
  ).style.display =
    "block";

  const percent =
    Math.round(
      (
        correctCount /
        questions.length
      ) * 100
    );

  document.getElementById(
    "finalScore"
  ).textContent =
    score.toFixed(1) +
    " از 20";

  document.getElementById(
    "finalDetails"
  ).innerHTML =

    "درست: " +
    correctCount +

    "<br>غلط: " +
    wrongCount +

    "<br>درصد: " +
    percent +
    "%";

  const wrongBox =
    document.getElementById(
      "wrongAnswers"
    );


  /* =========================
     همه پاسخ‌ها درست
  ========================= */

  if(
    wrongAnswers.length === 0
  ){

    wrongBox.innerHTML =

      '<div class="perfect-message">' +

      '<div class="arabic">' +

      '«كُل يَوم خُطوَة صَغِيرة تِقَرّبَك مِن حِلمَك...»' +

      '</div>' +

      '<div>' +

      'هر روز یک قدم کوچیک، تو رو به رویات نزدیک‌تر می‌کنه... 🌱' +

      '</div>' +

      '</div>';

    startPerfectCelebration();

  }else{

    let html =

      '<div class="wrong-title">' +

      'این کلمات رو بلد نبودی؛ ازشون اسکرین‌شات بگیر 📸' +

      '</div>';

    wrongAnswers.forEach(
      function(item){

        let word =
          item.word;

        word =
          word
            .replace(/«/g,"")
            .replace(/»/g,"")
            .replace(/ یعنی چه؟/g,"")
            .replace(
              / در محیط درمانی عراقی/g,
              ""
            );

        html +=

          '<div class="wrong-word">' +

          '<b>' +
          word +
          '</b>' +

          ': ' +
          item.correctAnswer +

          '</div>';

      }
    );

    wrongBox.innerHTML =
      html;

  }


  saveResult(
    score,
    percent,
    correctCount,
    wrongCount
  );

}


/* =========================
   ارسال به Google Sheets
========================= */

function saveResult(
  finalScore,
  percent,
  correct,
  wrong
){

  const status =
    document.getElementById(
      "saveStatus"
    );

  if(!eitaaUserId){

    status.textContent =
      "شناسه ایتا دریافت نشد.";

    return;

  }

  const data = {

    userId:
      eitaaUserId,

    studentName:
      studentName,

    score:
      finalScore.toFixed(1),

    percent:
      percent,

    correct:
      correct,

    wrong:
      wrong

  };

  fetch(
    GOOGLE_SCRIPT_URL,
    {

      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(data)

    }
  )

  .then(
    function(){

      status.textContent =
        "✓ نتیجه آزمون ارسال شد.";

    }
  )

  .catch(
    function(error){

      console.error(
        error
      );

      status.textContent =
        "⚠️ ارسال نتیجه انجام نشد.";

    }
  );

}


/* =========================
   افکت پاسخ درست
========================= */

function showConfetti(){

  const container =
    document.createElement(
      "div"
    );

  container.className =
    "confetti";

  for(
    let i=0;
    i<20;
    i++
  ){

    const piece =
      document.createElement(
        "span"
      );

    piece.style.position =
      "absolute";

    piece.style.left =
      Math.random()*100 +
      "%";

    piece.style.top =
      Math.random()*20 +
      "%";

    piece.style.width =
      "9px";

    piece.style.height =
      "18px";

    piece.style.background =
      "hsl(" +
      Math.random()*360 +
      ",90%,55%)";

    piece.style.animation =
      "fall 1s linear forwards";

    container.appendChild(
      piece
    );

  }

  document.body.appendChild(
    container
  );

  setTimeout(
    function(){

      container.remove();

    },
    1100
  );

}


/* =========================
   جشن کامل
   قلب باران + نورافشانی
========================= */

let celebrationHeartTimer;

let celebrationSparkleTimer;


function startPerfectCelebration(){

  const light =
    document.createElement(
      "div"
    );

  light.className =
    "light-show";

  document.body.appendChild(
    light
  );


  const hearts =
    document.createElement(
      "div"
    );

  hearts.className =
    "heart-rain";

  document.body.appendChild(
    hearts
  );


  /* بارش مداوم قلب‌ها */

  celebrationHeartTimer =
    setInterval(
      function(){

        createHeart(
          hearts
        );

      },
      120
    );


  /* نورافشانی مداوم */

  celebrationSparkleTimer =
    setInterval(
      function(){

        createSparkle();

      },
      100
    );


  /* شروع سریع جشن */

  for(
    let i=0;
    i<20;
    i++
  ){

    setTimeout(
      function(){

        createHeart(
          hearts
        );

        createSparkle();

      },
      i*60
    );

  }

}


/* =========================
   ساخت قلب
========================= */

function createHeart(
  container
){

  const heart =
    document.createElement(
      "div"
    );

  heart.className =
    "heart";

  const heartTypes = [
    "❤️",
    "💖",
    "💕",
    "💗",
    "💓",
    "💝"
  ];

  heart.textContent =
    heartTypes[
      Math.floor(
        Math.random() *
        heartTypes.length
      )
    ];

  heart.style.left =
    Math.random()*100 +
    "%";

  heart.style.fontSize =
    (
      18 +
      Math.random()*25
    ) +
    "px";

  heart.style.animationDuration =
    (
      3 +
      Math.random()*4
    ) +
    "s";

  container.appendChild(
    heart
  );

  setTimeout(
    function(){

      heart.remove();

    },
    8000
  );

}


/* =========================
   ساخت نور
========================= */

function createSparkle(){

  const sparkle =
    document.createElement(
      "div"
    );

  sparkle.className =
    "sparkle";

  sparkle.style.left =
    Math.random()*100 +
    "vw";

  sparkle.style.top =
    Math.random()*70 +
    "vh";

  sparkle.style.setProperty(
    "--dx",
    (
      Math.random()*200 -
      100
    ) +
    "px"
  );

  sparkle.style.setProperty(
    "--dy",
    (
      Math.random()*200 -
      100
    ) +
    "px"
  );

  document.body.appendChild(
    sparkle
  );

  setTimeout(
    function(){

      sparkle.remove();

    },
    1000
  );

}


/* =========================
   شروع
========================= */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    initEitaa();

  }
);
