  <!DOCTYPE html>
<title>آزمون عربی</title>

<body>

<h2>آزمون عربی عراقی</h2>

<p>معنی «شِبّاک» چیست؟</p>

<button onclick="check(1)">در</button>
<button onclick="check(2)">پنجره</button>

<p id="result"></p>

<script>

function check(x){

if(x==2){
document.getElementById("result").innerHTML="✅ درست";
}else{
document.getElementById("result").innerHTML="❌ غلط";
}

}

</script>

</body>
