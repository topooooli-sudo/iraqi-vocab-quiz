/* =========================

function initEitaa(){

  try{

    if(window.Eitaa && window.Eitaa.WebApp){

      const webApp=window.Eitaa.WebApp;

      if(typeof webApp.ready==="function")
        webApp.ready();

      if(typeof webApp.expand==="function")
        webApp.expand();

      if(webApp.initDataUnsafe && webApp.initDataUnsafe.user){

        const user=webApp.initDataUnsafe.user;
alert(JSON.stringify(user));
        if(user.id)
          eitaaUserId=String(user.id);

        if(user.first_name){

          document.getElementById("userInfo").textContent=
            "کاربر: "+user.first_name;

        }

      }

    }

  }catch(error){

    console.log("Eitaa error:",error);

  }

}


/* =========================
   نمایش سؤال
========================= */

function renderQuestion(){

  const q=questions[current];

  document.getElementById("progress").textContent=
    "سؤال "+(current+1)+" از "+questions.length;

  document.getElementById("question").textContent=q.q;

  const options=document.getElementById("options");

  options.innerHTML="";

  q.a.forEach(function(answer,index){

    const button=document.createElement("button");

    button.className="option";

    button.textContent=answer;

    button.onclick=function(){

      answerQuestion(index,button);

    };

    options.appendChild(button);

  });

}


/* =========================
   پاسخ به سؤال
========================= */

function answerQuestion(selected,selectedButton){

  const q=questions[current];

  const buttons=document.querySelectorAll(".option");

  buttons.forEach(function(button){

    button.classList.add("disabled");

  });


  if(selected===q.c){

    selectedButton.classList.add("correct");

    score+=0.5;

    correctCount++;

    navigator.vibrate?.(120);

    showConfetti();

  }else{

    selectedButton.classList.add("wrong");

    buttons[q.c].classList.add("correct");

    wrongCount++;


    /* ذخیره فقط سؤال و معنی درست */

    wrongAnswers.push({

      word:q.q,

      correctAnswer:q.a[q.c]

    });


    navigator.vibrate?.([80,50,80]);

  }


  setTimeout(function(){

    current++;

    if(current<questions.length){

      renderQuestion();

    }else{

      finishQuiz();

    }

  },900);

}


/* =========================
   پایان آزمون
========================= */

function finishQuiz(){

  document.getElementById("quizCard").style.display="none";

  document.getElementById("result").style.display="block";


  const percent=
    Math.round((correctCount/questions.length)*100);


  document.getElementById("finalScore").textContent=
    score.toFixed(1)+" از 20";


  document.getElementById("finalDetails").innerHTML=
    "درست: "+correctCount+
    "<br>غلط: "+wrongCount+
    "<br>درصد: "+percent+"%";


  const wrongBox=
    document.getElementById("wrongAnswers");


  /* اگر همه درست باشد */

  if(wrongAnswers.length===0){

    wrongBox.innerHTML=
      '<div class="perfect-message">'+

      '<div class="arabic">«خذ خطوة صغيرة نحو أحلامك كل يوم...»</div>'+

      '<div>هر روز یک قدم حتی کوچک به سمت رویاهات بردار... 🌱</div>'+

      '</div>';

  }else{


    /* اگر پاسخ غلط وجود داشته باشد */

    let html=
      '<div class="wrong-title">'+
      'این کلمات رو بلد نبودی؛ ازشون اسکرین‌شات بگیر 📸'+
      '</div>';


    wrongAnswers.forEach(function(item){

      /*
        فقط واژه و معنی درست نمایش داده می‌شود
        پاسخ فرد نمایش داده نمی‌شود
      */

      let word=item.word;

      /*
        حذف علامت‌های «» و عبارت «یعنی چه؟»
        برای اینکه خروجی کوتاه و مناسب اسکرین‌شات باشد
      */

      word=word
        .replace(/«/g,"")
        .replace(/»/g,"")
        .replace(/ یعنی چه؟/g,"")
        .replace(/ در محیط درمانی عراقی/g,"");


      html+=
        '<div class="wrong-word">'+
        '<b>'+word+'</b>'+
        ': '+
        item.correctAnswer+
        '</div>';

    });


    wrongBox.innerHTML=html;

  }


  saveResult(
    score,
    percent,
    correctCount,
    wrongCount
  );

}


/* =========================
   ارسال نتیجه به Google Sheets
========================= */

function saveResult(finalScore,percent,correct,wrong){

  const status=
    document.getElementById("saveStatus");


  if(!eitaaUserId){

    status.textContent=
      "شناسه ایتا دریافت نشد؛ آزمون در حالت وب اجرا شده است.";

    return;

  }


  const data={

    userId:eitaaUserId,

    score:finalScore.toFixed(1),

    percent:percent,

    correct:correct,

    wrong:wrong

  };


  fetch(GOOGLE_SCRIPT_URL,{

    method:"POST",

    mode:"no-cors",

    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },

    body:JSON.stringify(data)

  })

  .then(function(){

    status.textContent=
      "✓ نتیجه آزمون ارسال شد.";

  })

  .catch(function(error){

    console.error(error);

    status.textContent=
      "⚠️ ارسال نتیجه انجام نشد.";

  });

}


/* =========================
   افکت موفقیت
========================= */

function showConfetti(){

  const container=
    document.createElement("div");

  container.className="confetti";


  for(let i=0;i<35;i++){

    const piece=
      document.createElement("span");

    piece.style.left=
      Math.random()*100+"%";

    piece.style.top=
      Math.random()*20+"%";

    piece.style.background=
      "hsl("+Math.random()*360+",90%,55%)";

    piece.style.transform=
      "rotate("+Math.random()*360+"deg)";

    container.appendChild(piece);

  }


  document.body.appendChild(container);


  setTimeout(function(){

    container.remove();

  },1100);

}


/* =========================
   شروع آزمون
========================= */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    initEitaa();

    renderQuestion();

  }
);

</script>
