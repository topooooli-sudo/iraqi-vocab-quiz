<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون عربی عراقی - 40 سؤال</title>

<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

.container{
  max-width:720px;
  margin:auto;
  padding:18px 14px 40px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 3px 14px rgba(0,0,0,.08);
}

h1{
  font-size:23px;
  text-align:center;
  margin:5px 0 8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:18px;
}

.user-info{
  text-align:center;
  font-size:13px;
  color:#777;
  margin-bottom:12px;
}

.progress{
  height:9px;
  background:#e7e9ee;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0 20px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#2e7d32;
  transition:.25s;
}

.question-number{
  font-weight:bold;
  margin-bottom:12px;
}

.question{
  font-size:19px;
  line-height:1.8;
  margin-bottom:18px;
}

.option{
  width:100%;
  border:1px solid #d7dbe2;
  background:#fff;
  border-radius:12px;
  padding:13px 14px;
  margin:9px 0;
  text-align:right;
  font-size:16px;
  cursor:pointer;
  transition:.15s;
}

.option:hover{
  background:#f3f6f9;
}

.option:disabled{
  cursor:default;
}

.option.correct{
  background:#dff3e2;
  border-color:#39a34a;
}

.option.wrong{
  background:#fde0e0;
  border-color:#d33b3b;
}

.feedback{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:11px;
  font-weight:bold;
}

.feedback.correct{
  display:block;
  background:#e5f6e8;
  color:#176b27;
}

.feedback.wrong{
  display:block;
  background:#fde7e7;
  color:#a21f1f;
}

.next{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:15px;
  background:#333;
  color:white;
  font-size:17px;
  cursor:pointer;
}

.next:disabled{
  opacity:.45;
  cursor:default;
}

.result{
  text-align:center;
}

.score{
  font-size:34px;
  font-weight:bold;
  margin:15px 0;
}

.restart{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#2e7d32;
  color:#fff;
  font-size:17px;
  cursor:pointer;
}

.hidden{
  display:none;
}

.small{
  font-size:13px;
  color:#777;
  text-align:center;
  margin-top:12px;
}

#confettiCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>آزمون عربی عراقی</h1>

<div class="subtitle">
۴۰ سؤال — هر سؤال ۰٫۵ نمره — مجموع ۲۰ نمره
</div>

<div id="userInfo" class="user-info"></div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="quiz"></div>

</div>

<div class="card result hidden" id="result">

<h2>نتیجه آزمون</h2>

<div class="score" id="score"></div>

<div id="resultText"></div>

<div id="percentText"></div>

<div id="saveStatus" class="small">
در حال ثبت نتیجه...
</div>

<button class="restart" onclick="restartQuiz()">
شروع دوباره
</button>

</div>

</div>

<canvas id="confettiCanvas"></canvas>

<script>

/* =========================
   آدرس Google Apps Script
========================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwlQiJOCORFZaTSzNDJYWyZ7jh96OM3zrTcnMz90-1PqGqRqiVJLWSH152MxuW3QNua/exec";


/* =========================
   اطلاعات کاربر ایتا
========================= */

let eitaaUserId = "";

function initEitaa(){

  try{

    if(
      window.Eitaa &&
      window.Eitaa.WebApp
    ){

      const webApp =
        window.Eitaa.WebApp;

      if(typeof webApp.ready === "function"){
        webApp.ready();
      }

      if(typeof webApp.expand === "function"){
        webApp.expand();
      }

      if(
        webApp.initDataUnsafe &&
        webApp.initDataUnsafe.user
      ){

        const user =
          webApp.initDataUnsafe.user;

        if(user.id){
          eitaaUserId =
            String(user.id);
        }

        const userInfo =
          document.getElementById("userInfo");

        if(
          userInfo &&
          user.first_name
        ){

          userInfo.textContent =
            "کاربر: " +
            user.first_name;
        }

      }

    }

  }catch(error){

    console.log(
      "خطا در دریافت اطلاعات ایتا:",
      error
    );

  }

}


/* =========================
   ۴۰ سؤال آزمون
========================= */

const questions = [

{
q:"«شُوَكِت» یعنی چه؟",

},

{

},

{

c:2
},

{
q:"«شِسْمَك؟» یعنی چه؟",

c:1

{
q:"«هِنانه» یعنی چه؟",

{
q:"«هِنَاك» یعنی چه؟",
a:["اینجا","آنجا","کنار","داخل"],

{

c:0

{
q:"«مَا أَرِيد» یعنی چه؟",
a:["نمی‌دانم","نمی‌خواهم","نمی‌روم","نمی‌بینم"],
c:1
},

{
q:"«أكْدَر» یعنی چه؟",
a:["می‌توانم","می‌خواهم","می‌دانم","می‌گیرم"],

},

{
q:"«مَا أَكْدَر» یعنی چه؟",
a:["نمی‌خواهم","نمی‌توانم","نمی‌دانم","نمی‌روم"],

c:0

{

a:["چه ربطی به تو دارد؟ / به تو چه؟","کجایی؟","چقدر می‌خواهی؟","چه وقت می‌آیی؟"],
c:0
},

{
q:"«مَا أَدْرِي» یعنی چه؟",

c:1

/* =========================
   وضعیت آزمون
========================= */

let current = 0;
let score = 0;
let answered = false;


/* =========================
   نمایش سؤال
========================= */

function renderQuestion(){

  answered = false;

  const item =
    questions[current];

  const quiz =
    document.getElementById("quiz");

  quiz.innerHTML = `

    <div class="question-number">
      سؤال ${current + 1} از ${questions.length}
    </div>

    <div class="question">
      ${item.q}
    </div>

    <div id="options">

      ${item.a.map((x,i)=>`

        <button
          class="option"
          onclick="answer(${i})">

          ${String.fromCharCode(65+i)}. ${x}

        </button>

      `).join("")}

    </div>

    <div
      id="feedback"
      class="feedback">
    </div>

    <button
      id="next"
      class="next"
      onclick="nextQuestion()"
      disabled>

      ${
        current === questions.length - 1
        ? "مشاهده نتیجه"
        : "سؤال بعدی"
      }

    </button>
  `;


  /*
    درصد پیشرفت:
    سؤال اول = کمی پیشرفت
    سؤال آخر = نزدیک ۱۰۰٪
  */

  document
    .getElementById("progressBar")
    .style.width =
      `${((current + 1) / questions.length) * 100}%`;

}


/* =========================
   پاسخ به سؤال
========================= */

function answer(index){

  if(answered) return;

  answered = true;

  const item =
    questions[current];

  const buttons =
    document.querySelectorAll(".option");


  buttons.forEach(
    b => b.disabled = true
  );


  buttons[item.c]
    .classList
    .add("correct");


  const feedback =
    document.getElementById("feedback");


  if(index === item.c){

    score += 0.5;

    celebrate();

    feedback.textContent =
      "✓ پاسخ درست — ۰٫۵ نمره";

    feedback.className =
      "feedback correct";

  }else{

    buttons[index]
      .classList
      .add("wrong");

    feedback.textContent =
      "✗ پاسخ نادرست — پاسخ صحیح مشخص شده است";

    feedback.className =
      "feedback wrong";

  }


  document
    .getElementById("next")
    .disabled = false;

}


/* =========================
   سؤال بعدی
========================= */

function nextQuestion(){

  if(!answered) return;

  current++;


  if(current < questions.length){

    renderQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }else{

    document
      .querySelector(
        ".container > .card:first-child"
      )
      .classList
      .add("hidden");


    document
      .getElementById("result")
      .classList
      .remove("hidden");


    const correct =
      Math.round(score / 0.5);

    const wrong =
      questions.length - correct;


    const percent =
      Math.round(
        (correct / questions.length) * 100
      );


    document
      .getElementById("score")
      .textContent =
        `${score.toFixed(1)} از 20`;


    document
      .getElementById("resultText")
      .textContent =
        `تعداد پاسخ‌های صحیح: ${correct} از ${questions.length}`;


    document
      .getElementById("percentText")
      .textContent =
        `درصد موفقیت: ${percent}٪`;


    document
      .getElementById("progressBar")
      .style.width = "100%";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


    saveResult(
      score,
      percent,
      correct,
      wrong
    );

  }

}


/* =========================
   ثبت نتیجه در Google Sheets
========================= */

function saveResult(
  finalScore,
  percent,
  correct,
  wrong
){

  const status =
    document.getElementById("saveStatus");


  if(!eitaaUserId){

    status.textContent =
      "شناسه ایتا دریافت نشد؛ آزمون در حالت وب اجرا شده است.";

    return;
  }


  const data = {

    userId:
      eitaaUserId,

    score:
      finalScore.toFixed(1),

    percent:
      percent,

    correct:
      correct,

    wrong:
      wrong

  };


  fetch(
    GOOGLE_SCRIPT_URL,
    {
      method:"POST",

      mode:"no-cors",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(data)
    }
  )
  .then(()=>{

    status.textContent =
      "✓ نتیجه آزمون با موفقیت ارسال شد.";

  })
  .catch(error=>{

    console.error(error);

    status.textContent =
      "⚠️ ارسال نتیجه انجام نشد.";

  });

}


/* =========================
   شروع دوباره
========================= */

function restartQuiz(){

  current = 0;

  score = 0;

  answered = false;


  document
    .getElementById("result")
    .classList
    .add("hidden");


  document
    .querySelector(
      ".container > .card:first-child"
    )
    .classList
    .remove("hidden");


  renderQuestion();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   نورافشانی + ویبره
========================= */

function celebrate(){

  /*
    ویبره
  */

  if(navigator.vibrate){

    navigator.vibrate([
      60,
      25,
      80
    ]);

  }


  const canvas =
    document.getElementById(
      "confettiCanvas"
    );

  const ctx =
    canvas.getContext("2d");


  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;


  const colors = [
    "#ff1744",
    "#ff9100",
    "#ffee00",
    "#00e676",
    "#00b0ff",
    "#7c4dff",
    "#ff00c8"
  ];


  const pieces = [];


  for(let i=0;i<75;i++){

    pieces.push({

      x:
        canvas.width / 2,

      y:
        canvas.height * 0.38,

      vx:
        (Math.random()-0.5)*18,

      vy:
        -Math.random()*13-5,

      size:
        Math.random()*7+4,

      gravity:
        0.35 + Math.random()*0.2,

      rotation:
        Math.random()*Math.PI,

      rotationSpeed:
        (Math.random()-0.5)*0.5,

      life:
        60 + Math.random()*20,

      color:
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ]

    });

  }


  const start =
    performance.now();


  function animate(now){

    const elapsed =
      now - start;


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    let alive = false;


    pieces.forEach(p=>{

      if(p.life <= 0) return;

      alive = true;


      p.x += p.vx;

      p.y += p.vy;

      p.vy += p.gravity;

      p.vx *= 0.985;

      p.rotation +=
        p.rotationSpeed;

      p.life--;


      ctx.save();


      ctx.globalAlpha =
        Math.max(
          0,
          p.life / 70
        );


      ctx.translate(
        p.x,
        p.y
      );


      ctx.rotate(
        p.rotation
      );


      ctx.fillStyle =
        p.color;


      ctx.fillRect(
        -p.size/2,
        -p.size/2,
        p.size,
        p.size
      );


      ctx.restore();

    });


    if(
      alive &&
      elapsed < 1000
    ){

      requestAnimationFrame(
        animate
      );

    }else{

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    }

  }


  requestAnimationFrame(
    animate
  );

}


/* =========================
   شروع برنامه
========================= */

console.log("مرحله 1");
initEitaa();
console.log("مرحله 2");
renderQuestion();
console.log("مرحله 3");

</script>
